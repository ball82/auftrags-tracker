<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'auftraege/styles.css' %}">
    <title>Aufträge</title>
</head>
<body>
    <h1>Aufträge</h1>
    <ul>
        {% for auftrag in auftraege %}
            <li>{{ auftrag.kunde }} – {{ auftrag.get_status_display }} ({{ auftrag.kunden_nummer }})</li>
        {% empty %}
            <li>Noch keine Aufträge.</li>
        {% endfor %}
    </ul>
</body>
</html>
